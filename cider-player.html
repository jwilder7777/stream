<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cider Now Playing</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <script
            src="https://cdn.socket.io/4.7.5/socket.io.min.js"
            integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO"
            crossorigin="anonymous"
        ></script>
        <style>
            /* ============================================================
     CIDER NOW-PLAYING OVERLAY
     Lower-third bar for OBS browser source.
     Polls Cider RPC at http://localhost:10767 every 1 second.
     ============================================================ */

            :root {
                /* Edit these to taste */
                --bar-width: 720px;
                --bar-height: 160px;
                --art-size: 130px;
                --pad: 15px;
                --radius: 14px;
                --progress-height: 4px;
                --upnext-height: 36px;
                --upnext-gap: 8px;
                --upnext-thumb-size: 28px;

                /* Colors */
                --text: #ffffff;
                --text-dim: rgba(255, 255, 255, 0.72);
                --progress-bg: rgba(255, 255, 255, 0.2);
                --progress-fill: #ffffff;
                --bar-tint: rgba(
                    0,
                    0,
                    0,
                    0.35
                ); /* darken layer over blurred art for readability */
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                background: transparent !important; /* OBS browser source — keep transparent */
                overflow: hidden;
                font-family: "Sora", system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* Hide everything until we get a track — prevents flash of empty bar on stream startup */
            .stage {
                width: var(--bar-width);
                /* height auto so the upnext bar can stack below cleanly */
                position: fixed;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%) translateY(140%);
                opacity: 0;
                transition:
                    transform 600ms cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 400ms ease;
            }
            .stage.visible {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }

            /* Slide-down hide for when nothing is playing */
            .stage.hiding {
                transform: translateX(-50%) translateY(140%);
                opacity: 0;
            }

            .bar {
                position: relative;
                width: 100%;
                height: var(--bar-height);
                border-radius: var(--radius);
                overflow: hidden;
                box-shadow:
                    0 20px 50px rgba(0, 0, 0, 0.55),
                    0 4px 12px rgba(0, 0, 0, 0.35),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            }

            /* Blurred album art layer — sits behind everything */
            .bg {
                position: absolute;
                inset: -40px; /* expand to hide blur edges */
                background-size: cover;
                background-position: center;
                filter: blur(28px) saturate(1.4) brightness(0.85);
                transform: scale(1.15);
                transition: background-image 600ms ease;
                will-change: background-image;
            }

            /* Dark vignette/tint over the blur for text contrast */
            .tint {
                position: absolute;
                inset: 0;
                background:
                    linear-gradient(
                        90deg,
                        rgba(0, 0, 0, 0.55) 0%,
                        rgba(0, 0, 0, 0.35) 40%,
                        rgba(0, 0, 0, 0.45) 100%
                    ),
                    var(--bar-tint);
            }

            /* Subtle noise texture for premium feel */
            .grain {
                position: absolute;
                inset: 0;
                opacity: 0.06;
                pointer-events: none;
                background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
            }

            /* Main content row */
            .content {
                position: relative;
                height: 100%;
                padding: var(--pad);
                display: flex;
                align-items: center;
                gap: 18px;
            }

            /* Album art (sharp version) */
            .art-wrap {
                position: relative;
                width: var(--art-size);
                height: var(--art-size);
                flex-shrink: 0;
                border-radius: 8px;
                overflow: hidden;
                box-shadow:
                    0 8px 22px rgba(0, 0, 0, 0.45),
                    0 2px 6px rgba(0, 0, 0, 0.3),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            }
            .art {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: opacity 400ms ease;
            }
            .art.swap {
                opacity: 0;
            }

            /* Track info column */
            .info {
                flex: 1;
                min-width: 0; /* allow flex children to shrink */
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 6px;
                padding-bottom: 14px; /* leave room for the progress bar */
            }

            .now-playing-label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-family: "Inter", sans-serif;
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: var(--text-dim);
                margin-bottom: 2px;
            }

            /* Animated equalizer bars next to "NOW PLAYING" */
            .eq {
                display: inline-flex;
                align-items: flex-end;
                gap: 2px;
                height: 11px;
            }
            .eq span {
                display: block;
                width: 2px;
                background: #ffffff;
                border-radius: 1px;
                animation: eq 0.9s ease-in-out infinite;
            }
            .eq span:nth-child(1) {
                animation-delay: -0.4s;
                height: 60%;
            }
            .eq span:nth-child(2) {
                animation-delay: -0.2s;
                height: 100%;
            }
            .eq span:nth-child(3) {
                animation-delay: -0.6s;
                height: 75%;
            }
            .eq span:nth-child(4) {
                animation-delay: -0.1s;
                height: 50%;
            }
            /* When paused, freeze the bars */
            .stage.paused .eq span {
                animation-play-state: paused;
            }

            @keyframes eq {
                0%,
                100% {
                    transform: scaleY(0.3);
                }
                50% {
                    transform: scaleY(1);
                }
            }

            .title {
                font-family: "Sora", sans-serif;
                font-size: 24px;
                font-weight: 700;
                line-height: 1.15;
                color: var(--text);
                text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
                /* truncate long titles cleanly */
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                transition: opacity 400ms ease;
                letter-spacing: -0.01em;
            }
            .title.swap {
                opacity: 0;
            }

            .artist {
                font-family: "Inter", sans-serif;
                font-size: 15px;
                font-weight: 400;
                line-height: 1.2;
                color: var(--text-dim);
                text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                transition: opacity 400ms ease;
            }
            .artist.swap {
                opacity: 0;
            }

            /* Progress bar pinned to bottom, full width of bar */
            .progress {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: var(--progress-height);
                background: var(--progress-bg);
            }
            .progress-fill {
                height: 100%;
                width: 0%;
                background: var(--progress-fill);
                transition: width 1s linear;
                box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            }
            /* When paused, kill the smooth transition so it freezes immediately */
            .stage.paused .progress-fill {
                transition: none;
            }

            /* ============ UP NEXT mini-bar ============ */
            .upnext {
                width: 100%;
                height: var(--upnext-height);
                margin-top: var(--upnext-gap);
                border-radius: 10px;
                background: rgba(0, 0, 0, 0.55);
                backdrop-filter: blur(20px) saturate(1.4);
                -webkit-backdrop-filter: blur(20px) saturate(1.4);
                box-shadow:
                    0 8px 22px rgba(0, 0, 0, 0.45),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 14px 0 4px;
                opacity: 0;
                transform: translateY(-4px);
                transition:
                    opacity 400ms ease,
                    transform 400ms ease;
                pointer-events: none;
            }
            .upnext.show {
                opacity: 1;
                transform: translateY(0);
            }

            .upnext-thumb {
                width: var(--upnext-thumb-size);
                height: var(--upnext-thumb-size);
                border-radius: 5px;
                background-size: cover;
                background-position: center;
                background-color: rgba(255, 255, 255, 0.06);
                flex-shrink: 0;
                margin-left: 4px;
                box-shadow:
                    0 2px 6px rgba(0, 0, 0, 0.4),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            }

            .upnext-label {
                font-family: "Inter", sans-serif;
                font-size: 9px;
                font-weight: 700;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: rgba(255, 255, 255, 0.55);
                flex-shrink: 0;
            }

            .upnext-info {
                flex: 1;
                min-width: 0;
                font-family: "Inter", sans-serif;
                font-size: 12px;
                color: var(--text-dim);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            }
            .upnext-info .upnext-title {
                color: var(--text);
                font-weight: 600;
            }
            .upnext-info .upnext-sep {
                margin: 0 6px;
                opacity: 0.4;
            }

            /* Time markers, small and subtle */
            .times {
                position: absolute;
                bottom: 10px;
                right: 14px;
                font-family: "Inter", sans-serif;
                font-size: 10px;
                font-weight: 500;
                color: var(--text-dim);
                letter-spacing: 0.04em;
                font-variant-numeric: tabular-nums;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            }
        </style>
    </head>
    <body>
        <div class="stage" id="stage">
            <div class="bar">
                <div class="bg" id="bg"></div>
                <div class="tint"></div>
                <div class="grain"></div>

                <div class="content">
                    <div class="art-wrap">
                        <img class="art" id="art" alt="" />
                    </div>

                    <div class="info">
                        <div class="now-playing-label">
                            <span class="eq" aria-hidden="true">
                                <span></span><span></span><span></span
                                ><span></span>
                            </span>
                            <span id="status-label">Now Playing</span>
                        </div>
                        <div class="title" id="title">—</div>
                        <div class="artist" id="artist">—</div>
                    </div>
                </div>

                <div class="times">
                    <span id="elapsed">0:00</span> /
                    <span id="duration">0:00</span>
                </div>
                <div class="progress">
                    <div class="progress-fill" id="progress"></div>
                </div>
            </div>

            <div class="upnext" id="upnext">
                <div class="upnext-thumb" id="upnext-thumb"></div>
                <div class="upnext-label">Up Next</div>
                <div class="upnext-info">
                    <span class="upnext-title" id="upnext-title">—</span>
                    <span class="upnext-sep">·</span>
                    <span class="upnext-artist" id="upnext-artist">—</span>
                </div>
            </div>
        </div>

        <script>
            (() => {
                // Connects to Cider over socket.io WebSocket — push-based, no polling,
                // no auth token, no CORS preflight.
                const CIDER_HOST = "http://localhost:10767";
                const ART_SIZE = 600;

                const stage = document.getElementById("stage");
                const bg = document.getElementById("bg");
                const art = document.getElementById("art");
                const titleEl = document.getElementById("title");
                const artistEl = document.getElementById("artist");
                const elapsedEl = document.getElementById("elapsed");
                const durationEl = document.getElementById("duration");
                const progressEl = document.getElementById("progress");
                const statusEl = document.getElementById("status-label");
                const upnextEl = document.getElementById("upnext");
                const upnextThumbEl = document.getElementById("upnext-thumb");
                const upnextTitleEl = document.getElementById("upnext-title");
                const upnextArtistEl = document.getElementById("upnext-artist");

                let lastSongId = null;

                function formatTime(sec) {
                    if (!isFinite(sec) || sec < 0) sec = 0;
                    const m = Math.floor(sec / 60);
                    const s = Math.floor(sec % 60);
                    return `${m}:${s.toString().padStart(2, "0")}`;
                }

                function resolveArtworkUrl(rawUrl, size = ART_SIZE) {
                    if (!rawUrl) return "";
                    return rawUrl.replace("{w}", size).replace("{h}", size);
                }

                function showStage() {
                    stage.classList.add("visible");
                    stage.classList.remove("hiding");
                }
                function hideStage() {
                    stage.classList.add("hiding");
                    stage.classList.remove("visible");
                }
                function setPaused(paused) {
                    stage.classList.toggle("paused", paused);
                    statusEl.textContent = paused ? "Paused" : "Now Playing";
                }

                function applyTrack(info) {
                    if (!info) return;
                    const songId =
                        (info.playParams && info.playParams.id) ||
                        `${info.name}|${info.artistName}`;

                    if (songId === lastSongId) {
                        showStage();
                        return;
                    }
                    lastSongId = songId;

                    art.classList.add("swap");
                    titleEl.classList.add("swap");
                    artistEl.classList.add("swap");

                    setTimeout(() => {
                        const artUrl = resolveArtworkUrl(
                            info.artwork && info.artwork.url,
                            ART_SIZE,
                        );
                        if (artUrl) {
                            art.src = artUrl;
                            bg.style.backgroundImage = `url("${artUrl}")`;
                        }
                        titleEl.textContent = info.name || "—";
                        artistEl.textContent = info.artistName || "—";

                        requestAnimationFrame(() => {
                            art.classList.remove("swap");
                            titleEl.classList.remove("swap");
                            artistEl.classList.remove("swap");
                        });
                    }, 350);

                    showStage();
                }

                function applyUpNext(track) {
                    if (!track) {
                        upnextEl.classList.remove("show");
                        return;
                    }
                    const artUrl = resolveArtworkUrl(
                        track.artwork && track.artwork.url,
                        200,
                    );
                    if (artUrl) {
                        upnextThumbEl.style.backgroundImage = `url("${artUrl}")`;
                    } else {
                        upnextThumbEl.style.backgroundImage = "";
                    }
                    upnextTitleEl.textContent = track.name || "—";
                    upnextArtistEl.textContent = track.artistName || "—";
                    upnextEl.classList.add("show");
                }

                function applyProgress(data) {
                    // Cider sends currentPlaybackDuration in seconds via socket events
                    const totalSec =
                        data.currentPlaybackDuration ||
                        (data.durationInMillis || 0) / 1000 ||
                        0;
                    const currentSec = data.currentPlaybackTime || 0;
                    const pct =
                        totalSec > 0
                            ? Math.min(100, (currentSec / totalSec) * 100)
                            : 0;
                    progressEl.style.width = pct + "%";
                    elapsedEl.textContent = formatTime(currentSec);
                    durationEl.textContent = formatTime(totalSec);
                }

                // HTTP fetches for initial state + queue. Requires Cider's
                // "Require API Tokens" to be OFF (Settings → Connectivity), since
                // we don't send a token from a public origin.
                async function fetchJson(path) {
                    try {
                        const res = await fetch(`${CIDER_HOST}${path}`);
                        if (!res.ok) return null;
                        if (res.status === 204) return { ok: true };
                        return await res.json();
                    } catch {
                        return null;
                    }
                }

                async function refreshUpNext(currentInfo) {
                    const data = await fetchJson("/api/v1/playback/queue");
                    if (!data) {
                        applyUpNext(null);
                        return;
                    }
                    const items =
                        data.data || data.queue || data.items ||
                        (Array.isArray(data) ? data : []);
                    if (!items.length) {
                        applyUpNext(null);
                        return;
                    }
                    const currentId =
                        currentInfo &&
                        ((currentInfo.playParams &&
                            currentInfo.playParams.id) ||
                            `${currentInfo.name}|${currentInfo.artistName}`);
                    let next = items[0];
                    const nextId =
                        (next.playParams && next.playParams.id) ||
                        `${next.name}|${next.artistName}`;
                    if (currentId && nextId === currentId) next = items[1];
                    applyUpNext(next || null);
                }

                async function fetchInitialState() {
                    const np = await fetchJson("/api/v1/playback/now-playing");
                    if (!np || np.status !== "ok" || !np.info) return;
                    applyTrack(np.info);
                    applyProgress(np.info);
                    const playing = await fetchJson("/api/v1/playback/is-playing");
                    if (playing) setPaused(!playing.is_playing);
                    refreshUpNext(np.info);
                    console.log("[cider-overlay] initial state:", np.info.name);
                }

                const cider = io(CIDER_HOST, { transports: ["websocket"] });

                cider.on("connect", () => {
                    console.log("[cider-overlay] socket connected");
                    fetchInitialState();
                });

                cider.on("connect_error", (err) => {
                    console.warn("[cider-overlay] connect_error:", err.message);
                });

                cider.on("API:Playback", ({ data, type }) => {
                    switch (type) {
                        case "playbackStatus.nowPlayingItemDidChange":
                            applyTrack(data);
                            setPaused(false);
                            refreshUpNext(data);
                            break;
                        case "playbackStatus.playbackTimeDidChange":
                            applyProgress(data);
                            break;
                        case "playbackStatus.playbackStateDidChange":
                            if (data.state === "playing") {
                                setPaused(false);
                                if (data.attributes) {
                                    applyTrack(data.attributes);
                                    refreshUpNext(data.attributes);
                                } else {
                                    showStage();
                                }
                            } else if (data.state === "paused") {
                                setPaused(true);
                            } else if (data.state === "stopped") {
                                hideStage();
                                applyUpNext(null);
                                lastSongId = null;
                            }
                            break;
                    }
                });

                cider.on("disconnect", () => {
                    hideStage();
                    applyUpNext(null);
                    lastSongId = null;
                });
            })();
        </script>
    </body>
</html>
