<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cider Now Playing</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <script
            src="https://cdn.socket.io/4.7.5/socket.io.min.js"
            integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO"
            crossorigin="anonymous"
        ></script>
        <style>
            /* ============================================================
     CIDER NOW-PLAYING OVERLAY
     Lower-third bar for OBS browser source.
     Polls Cider RPC at http://localhost:10767 every 1 second.
     ============================================================ */

            :root {
                /* Edit these to taste */
                --bar-width: 900px;
                --bar-height: 220px;
                --art-size: 180px;
                --pad: 20px;
                --radius: 18px;
                --progress-height: 5px;
                --upnext-height: 68px;
                --upnext-gap: 12px;
                --upnext-thumb-size: 50px;

                /* Colors */
                --text: #ffffff;
                --text-dim: rgba(255, 255, 255, 0.72);
                --progress-bg: rgba(255, 255, 255, 0.2);
                --progress-fill: #ffffff;
                --bar-tint: rgba(
                    0,
                    0,
                    0,
                    0.35
                ); /* darken layer over blurred art for readability */
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                background: transparent !important; /* OBS browser source — keep transparent */
                overflow: hidden;
                font-family: "Sora", system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* Centered on the page — easier to grab and resize as a browser source */
            .stage {
                width: var(--bar-width);
                position: fixed;
                top: 50%;
                left: 50%;
                /* slide-in from below center, then settle at center */
                transform: translate(-50%, calc(-50% + 60px));
                opacity: 0;
                transition:
                    transform 600ms cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 400ms ease;
            }
            .stage.visible {
                transform: translate(-50%, -50%);
                opacity: 1;
            }

            .stage.hiding {
                transform: translate(-50%, calc(-50% + 60px));
                opacity: 0;
            }

            .bar {
                position: relative;
                width: 100%;
                height: var(--bar-height);
                border-radius: var(--radius);
                overflow: hidden;
                box-shadow:
                    0 20px 50px rgba(0, 0, 0, 0.55),
                    0 4px 12px rgba(0, 0, 0, 0.35),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            }

            /* Blurred album art layer — sits behind everything */
            .bg {
                position: absolute;
                inset: -40px; /* expand to hide blur edges */
                background-size: cover;
                background-position: center;
                filter: blur(28px) saturate(1.4) brightness(0.85);
                transform: scale(1.15);
                transition: background-image 600ms ease;
                will-change: background-image;
            }

            /* Dark vignette/tint over the blur for text contrast */
            .tint {
                position: absolute;
                inset: 0;
                background:
                    linear-gradient(
                        90deg,
                        rgba(0, 0, 0, 0.55) 0%,
                        rgba(0, 0, 0, 0.35) 40%,
                        rgba(0, 0, 0, 0.45) 100%
                    ),
                    var(--bar-tint);
            }

            /* Subtle noise texture for premium feel */
            .grain {
                position: absolute;
                inset: 0;
                opacity: 0.06;
                pointer-events: none;
                background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
            }

            /* Main content row */
            .content {
                position: relative;
                height: 100%;
                padding: var(--pad);
                display: flex;
                align-items: center;
                gap: 18px;
            }

            /* Album art (sharp version) */
            .art-wrap {
                position: relative;
                width: var(--art-size);
                height: var(--art-size);
                flex-shrink: 0;
                border-radius: 8px;
                overflow: hidden;
                box-shadow:
                    0 8px 22px rgba(0, 0, 0, 0.45),
                    0 2px 6px rgba(0, 0, 0, 0.3),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            }
            .art {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: opacity 400ms ease;
            }
            .art.swap {
                opacity: 0;
            }

            /* Track info column */
            .info {
                flex: 1;
                min-width: 0; /* allow flex children to shrink */
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 6px;
                padding-bottom: 14px; /* leave room for the progress bar */
            }

            .now-playing-label {
                display: flex;
                align-items: center;
                gap: 10px;
                font-family: "Inter", sans-serif;
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: var(--text-dim);
                margin-bottom: 4px;
            }

            /* Animated equalizer bars next to "NOW PLAYING" */
            .eq {
                display: inline-flex;
                align-items: flex-end;
                gap: 2px;
                height: 11px;
            }
            .eq span {
                display: block;
                width: 2px;
                background: #ffffff;
                border-radius: 1px;
                animation: eq 0.9s ease-in-out infinite;
            }
            .eq span:nth-child(1) {
                animation-delay: -0.4s;
                height: 60%;
            }
            .eq span:nth-child(2) {
                animation-delay: -0.2s;
                height: 100%;
            }
            .eq span:nth-child(3) {
                animation-delay: -0.6s;
                height: 75%;
            }
            .eq span:nth-child(4) {
                animation-delay: -0.1s;
                height: 50%;
            }
            /* When paused, freeze the bars */
            .stage.paused .eq span {
                animation-play-state: paused;
            }

            @keyframes eq {
                0%,
                100% {
                    transform: scaleY(0.3);
                }
                50% {
                    transform: scaleY(1);
                }
            }

            .title {
                font-family: "Sora", sans-serif;
                font-size: 32px;
                font-weight: 700;
                line-height: 1.15;
                color: var(--text);
                text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
                /* truncate long titles cleanly */
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                transition: opacity 400ms ease;
                letter-spacing: -0.01em;
            }
            .title.swap {
                opacity: 0;
            }

            .artist {
                font-family: "Inter", sans-serif;
                font-size: 19px;
                font-weight: 400;
                line-height: 1.2;
                color: var(--text-dim);
                text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                transition: opacity 400ms ease;
            }
            .artist.swap {
                opacity: 0;
            }

            /* Progress bar pinned to bottom, full width of bar */
            .progress {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: var(--progress-height);
                background: var(--progress-bg);
            }
            .progress-fill {
                height: 100%;
                width: 0%;
                background: var(--progress-fill);
                transition: width 1s linear;
                box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            }
            /* When paused, kill the smooth transition so it freezes immediately */
            .stage.paused .progress-fill {
                transition: none;
            }

            /* ============ UP NEXT mini-bar ============ */
            .upnext {
                position: relative;
                width: 100%;
                height: var(--upnext-height);
                margin-top: var(--upnext-gap);
                border-radius: var(--radius);
                overflow: hidden;
                box-shadow:
                    0 14px 32px rgba(0, 0, 0, 0.5),
                    0 3px 8px rgba(0, 0, 0, 0.32),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
                opacity: 0;
                transform: translateY(-4px);
                transition:
                    opacity 400ms ease,
                    transform 400ms ease;
                pointer-events: none;
            }
            .upnext.show {
                opacity: 1;
                transform: translateY(0);
            }

            /* Blurred album art behind up-next, same approach as main bar */
            .upnext-bg {
                position: absolute;
                inset: -30px;
                background-size: cover;
                background-position: center;
                filter: blur(24px) saturate(1.4) brightness(0.75);
                transform: scale(1.15);
                transition: background-image 600ms ease;
                will-change: background-image;
            }

            .upnext-tint {
                position: absolute;
                inset: 0;
                background:
                    linear-gradient(
                        90deg,
                        rgba(0, 0, 0, 0.6) 0%,
                        rgba(0, 0, 0, 0.4) 40%,
                        rgba(0, 0, 0, 0.5) 100%
                    ),
                    var(--bar-tint);
            }

            .upnext-content {
                position: relative;
                height: 100%;
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 0 16px 0 7px;
            }

            .upnext-thumb {
                width: var(--upnext-thumb-size);
                height: var(--upnext-thumb-size);
                border-radius: 6px;
                background-size: cover;
                background-position: center;
                background-color: rgba(255, 255, 255, 0.06);
                flex-shrink: 0;
                box-shadow:
                    0 3px 8px rgba(0, 0, 0, 0.45),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            }

            .upnext-label {
                font-family: "Inter", sans-serif;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: rgba(255, 255, 255, 0.6);
                flex-shrink: 0;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            }

            .upnext-info {
                flex: 1;
                min-width: 0;
                font-family: "Inter", sans-serif;
                font-size: 16px;
                color: var(--text-dim);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            }
            .upnext-info .upnext-title {
                color: var(--text);
                font-weight: 600;
            }
            .upnext-info .upnext-sep {
                margin: 0 7px;
                opacity: 0.4;
            }

            /* Time markers, small and subtle */
            .times {
                position: absolute;
                bottom: 12px;
                right: 18px;
                font-family: "Inter", sans-serif;
                font-size: 12px;
                font-weight: 500;
                color: var(--text-dim);
                letter-spacing: 0.04em;
                font-variant-numeric: tabular-nums;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            }
        </style>
    </head>
    <body>
        <div class="stage" id="stage">
            <div class="bar">
                <div class="bg" id="bg"></div>
                <div class="tint"></div>
                <div class="grain"></div>

                <div class="content">
                    <div class="art-wrap">
                        <img class="art" id="art" alt="" />
                    </div>

                    <div class="info">
                        <div class="now-playing-label">
                            <span class="eq" aria-hidden="true">
                                <span></span><span></span><span></span
                                ><span></span>
                            </span>
                            <span id="status-label">Now Playing</span>
                        </div>
                        <div class="title" id="title">—</div>
                        <div class="artist" id="artist">—</div>
                    </div>
                </div>

                <div class="times">
                    <span id="elapsed">0:00</span> /
                    <span id="duration">0:00</span>
                </div>
                <div class="progress">
                    <div class="progress-fill" id="progress"></div>
                </div>
            </div>

            <div class="upnext" id="upnext">
                <div class="upnext-bg" id="upnext-bg"></div>
                <div class="upnext-tint"></div>
                <div class="upnext-content">
                    <div class="upnext-thumb" id="upnext-thumb"></div>
                    <div class="upnext-label">Up Next</div>
                    <div class="upnext-info">
                        <span class="upnext-title" id="upnext-title">—</span>
                        <span class="upnext-sep">·</span>
                        <span class="upnext-artist" id="upnext-artist">—</span>
                    </div>
                </div>
            </div>
        </div>

        <script>
            (() => {
                // Connects to Cider over socket.io WebSocket — push-based, no polling,
                // no auth token, no CORS preflight.
                const CIDER_HOST = "http://localhost:10767";
                const ART_SIZE = 600;

                const stage = document.getElementById("stage");
                const bg = document.getElementById("bg");
                const art = document.getElementById("art");
                const titleEl = document.getElementById("title");
                const artistEl = document.getElementById("artist");
                const elapsedEl = document.getElementById("elapsed");
                const durationEl = document.getElementById("duration");
                const progressEl = document.getElementById("progress");
                const statusEl = document.getElementById("status-label");
                const upnextEl = document.getElementById("upnext");
                const upnextBgEl = document.getElementById("upnext-bg");
                const upnextThumbEl = document.getElementById("upnext-thumb");
                const upnextTitleEl = document.getElementById("upnext-title");
                const upnextArtistEl = document.getElementById("upnext-artist");

                let lastSongId = null;

                function formatTime(sec) {
                    if (!isFinite(sec) || sec < 0) sec = 0;
                    const m = Math.floor(sec / 60);
                    const s = Math.floor(sec % 60);
                    return `${m}:${s.toString().padStart(2, "0")}`;
                }

                function resolveArtworkUrl(rawUrl, size = ART_SIZE) {
                    if (!rawUrl) return "";
                    return rawUrl.replace("{w}", size).replace("{h}", size);
                }

                function showStage() {
                    stage.classList.add("visible");
                    stage.classList.remove("hiding");
                }
                function hideStage() {
                    stage.classList.add("hiding");
                    stage.classList.remove("visible");
                }
                function setPaused(paused) {
                    stage.classList.toggle("paused", paused);
                    statusEl.textContent = paused ? "Paused" : "Now Playing";
                }

                function applyTrack(info) {
                    if (!info) return;
                    const songId =
                        (info.playParams && info.playParams.id) ||
                        `${info.name}|${info.artistName}`;

                    if (songId === lastSongId) {
                        showStage();
                        return;
                    }
                    lastSongId = songId;

                    art.classList.add("swap");
                    titleEl.classList.add("swap");
                    artistEl.classList.add("swap");

                    setTimeout(() => {
                        const artUrl = resolveArtworkUrl(
                            info.artwork && info.artwork.url,
                            ART_SIZE,
                        );
                        if (artUrl) {
                            art.src = artUrl;
                            bg.style.backgroundImage = `url("${artUrl}")`;
                        }
                        titleEl.textContent = info.name || "—";
                        artistEl.textContent = info.artistName || "—";

                        requestAnimationFrame(() => {
                            art.classList.remove("swap");
                            titleEl.classList.remove("swap");
                            artistEl.classList.remove("swap");
                        });
                    }, 350);

                    showStage();
                }

                function applyUpNext(track) {
                    if (!track) {
                        upnextEl.classList.remove("show");
                        return;
                    }
                    const t = track.attributes || track;
                    const artUrl = resolveArtworkUrl(
                        t.artwork && t.artwork.url,
                        ART_SIZE,
                    );
                    if (artUrl) {
                        upnextThumbEl.style.backgroundImage = `url("${artUrl}")`;
                        upnextBgEl.style.backgroundImage = `url("${artUrl}")`;
                    } else {
                        upnextThumbEl.style.backgroundImage = "";
                        upnextBgEl.style.backgroundImage = "";
                    }
                    upnextTitleEl.textContent = t.name || t.title || "—";
                    upnextArtistEl.textContent =
                        t.artistName || t.artist || "—";
                    upnextEl.classList.add("show");
                }

                function applyProgress(data) {
                    // Cider sends currentPlaybackDuration in seconds via socket events
                    const totalSec =
                        data.currentPlaybackDuration ||
                        (data.durationInMillis || 0) / 1000 ||
                        0;
                    const currentSec = data.currentPlaybackTime || 0;
                    const pct =
                        totalSec > 0
                            ? Math.min(100, (currentSec / totalSec) * 100)
                            : 0;
                    progressEl.style.width = pct + "%";
                    elapsedEl.textContent = formatTime(currentSec);
                    durationEl.textContent = formatTime(totalSec);
                }

                // HTTP fetches for initial state + queue. Requires Cider's
                // "Require API Tokens" to be OFF (Settings → Connectivity), since
                // we don't send a token from a public origin.
                async function fetchJson(path) {
                    try {
                        const res = await fetch(`${CIDER_HOST}${path}`);
                        if (!res.ok) return null;
                        if (res.status === 204) return { ok: true };
                        return await res.json();
                    } catch {
                        return null;
                    }
                }

                async function refreshUpNext(currentInfo) {
                    const data = await fetchJson("/api/v1/playback/queue");
                    if (!Array.isArray(data) || !data.length) {
                        applyUpNext(null);
                        return;
                    }

                    const idOf = (track) => {
                        if (!track) return null;
                        const a = track.attributes || {};
                        return (
                            (a.playParams && a.playParams.id) ||
                            track.id ||
                            (track.playParams && track.playParams.id) ||
                            null
                        );
                    };

                    let nextTrack = null;
                    const currentId = idOf(currentInfo);

                    // Cider's queue includes already-played tracks. Locate the
                    // currently-playing track and take the next one in the array.
                    if (currentId) {
                        const idx = data.findIndex(
                            (t) => idOf(t) === currentId,
                        );
                        if (idx >= 0 && idx + 1 < data.length) {
                            nextTrack = data[idx + 1];
                        }
                    }
                    // Fallback: first item still in "not yet played" state (0)
                    if (!nextTrack) {
                        nextTrack = data.find(
                            (t) => t._state && t._state.current === 0,
                        );
                    }
                    applyUpNext(nextTrack || null);
                }

                async function fetchInitialState() {
                    const np = await fetchJson("/api/v1/playback/now-playing");
                    if (!np || np.status !== "ok" || !np.info) return;
                    applyTrack(np.info);
                    applyProgress(np.info);
                    const playing = await fetchJson("/api/v1/playback/is-playing");
                    if (playing) setPaused(!playing.is_playing);
                    refreshUpNext(np.info);
                    console.log("[cider-overlay] initial state:", np.info.name);
                }

                const cider = io(CIDER_HOST, { transports: ["websocket"] });

                cider.on("connect", () => {
                    console.log("[cider-overlay] socket connected");
                    fetchInitialState();
                });

                cider.on("connect_error", (err) => {
                    console.warn("[cider-overlay] connect_error:", err.message);
                });

                cider.on("API:Playback", ({ data, type }) => {
                    switch (type) {
                        case "playbackStatus.nowPlayingItemDidChange":
                            applyTrack(data);
                            setPaused(false);
                            refreshUpNext(data);
                            break;
                        case "playbackStatus.playbackTimeDidChange":
                            applyProgress(data);
                            break;
                        case "playbackStatus.playbackStateDidChange":
                            if (data.state === "playing") {
                                setPaused(false);
                                if (data.attributes) {
                                    applyTrack(data.attributes);
                                    refreshUpNext(data.attributes);
                                } else {
                                    showStage();
                                }
                            } else if (data.state === "paused") {
                                setPaused(true);
                            } else if (data.state === "stopped") {
                                hideStage();
                                applyUpNext(null);
                                lastSongId = null;
                            }
                            break;
                    }
                });

                cider.on("disconnect", () => {
                    hideStage();
                    applyUpNext(null);
                    lastSongId = null;
                });
            })();
        </script>
    </body>
</html>
